/* Compact fanned card decks for reflective listening */
.listen-deck-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,215px),1fr));gap:18px;margin:24px 0}
.listen-deck{border:1px solid #a2a2b666;border-radius:18px;overflow:hidden;background:var(--card,#fff);box-shadow:0 5px 18px #00000012}
.listen-deck>summary{list-style:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;text-align:center;gap:7px;padding:25px 14px 15px;position:relative;min-height:185px}
.listen-deck>summary::-webkit-details-marker{display:none}
.deck-fan{height:86px;width:125px;display:block;position:relative;margin:0 auto 5px}
.deck-fan span{position:absolute;left:31px;top:3px;width:66px;height:84px;border:2px solid #fff;border-radius:10px;box-shadow:0 3px 8px #0003;background:linear-gradient(140deg,#bc9eff,#7656c7)}
.deck-fan span:nth-child(1){transform:rotate(-19deg) translateX(-16px);background:linear-gradient(140deg,#83e1d0,#348b9d)}
.deck-fan span:nth-child(2){transform:rotate(17deg) translateX(16px);background:linear-gradient(140deg,#ffcf86,#e9789e)}
.deck-fan span:nth-child(3){transform:rotate(0deg);background:linear-gradient(145deg,#b59eff,#7656c7)}
.deck-fan span:nth-child(3):after{content:'✦';color:white;font-size:29px;position:absolute;top:21px;left:20px}
.deck-title{font-weight:800;font-size:1.18rem}.deck-count{font-size:.87rem;opacity:.8}.deck-chevron{font-size:1.25rem;line-height:1;transition:transform .2s}
.listen-deck[open] .deck-chevron{transform:rotate(180deg)}
.deck-options{padding:8px 12px 15px;border-top:1px solid #9994;display:grid;gap:8px}
.deck-option{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;padding:12px;border-radius:12px}
.deck-option>span:first-child{display:flex;flex-direction:column;gap:4px}.deck-option b{font-size:.78rem;opacity:.8}.deck-option span span{font-size:.94rem}

/* Find Support: compact sections, with crisis actions visible */
.support-fold{padding:0;overflow:hidden}

</style><style>
.wheel-label{pointer-events:none}.diary-deck-wrap{max-width:420px;margin:12px auto 22px;text-align:center}.diary-deck-progress{font-weight:800;margin:10px;color:#fff;background:#49305f;border-radius:12px;padding:9px 12px;display:inline-block}.diary-deck-stack{position:relative;max-width:290px;margin:20px auto 24px;min-height:365px}.diary-deck-back{position:absolute;inset:0;border-radius:20px;background:#e7d3f6;border:3px solid #fff;box-shadow:0 5px 12px #0002}.diary-deck-back.one{transform:rotate(-5deg) translate(-8px,3px)}.diary-deck-back.two{transform:rotate(4deg) translate(7px,1px)}.diary-deck-card{position:relative;border-radius:20px;background:var(--emotion-card-color);color:white;min-height:365px;padding:16px;box-shadow:0 8px 20px #0003;display:flex;align-items:center;justify-content:center}.diary-deck-inner{width:100%;display:flex;flex-direction:column;align-items:center;gap:12px}.diary-deck-inner h3{color:white;font-size:1.65rem;margin:0}.diary-deck-inner p{color:white;margin:0;line-height:1.4}.diary-deck-flip{background:#fff!important;color:#35244a!important;border:0!important;border-radius:14px;padding:11px 17px;font-weight:800}.diary-deck-rating-buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;width:100%}.diary-deck-rating-buttons button{background:#fff;color:#2e2440;border:2px solid #fff;border-radius:12px;font-size:1.25rem;font-weight:800;padding:12px 0}.diary-deck-rating-buttons button.selected{background:#322247;color:white;outline:3px solid #fff}.diary-deck-nav{display:flex;align-items:center;justify-content:space-between;gap:8px}.diary-deck-nav button{font-size:.95rem;padding:10px 12px}.diary-deck-nav span{font-weight:700;font-size:.85rem}.diary-deck-hint{font-size:.85rem;line-height:1.45}
</style><style>

</style></head><body><header><div style="max-width:700px;margin:auto"><div class="theme-toggle" role="group" aria-label="Appearance"><span>Appearance</span><button id="light-theme" type="button" onclick="setTheme('light')">☀ Light</button><button id="dark-theme" type="button" onclick="setTheme('dark')">☾ Dark</button></div><h1>DBT Companion</h1><div>Small steps. Real skills. One moment at a time.</div></div></header><main><nav id="nav"></nav><section id="content" aria-live="polite"></section></main><div id="save-toast" role="status" aria-live="assertive" hidden></div><footer>Educational self-help prototype, not a substitute for professional care. If you're in immediate danger, contact local emergency services.</footer><script>
function setTheme(mode){if(mode!=="dark")mode="light";document.documentElement.dataset.theme=mode;try{localStorage.setItem("dbt-companion-theme",mode)}catch(e){};document.getElementById("light-theme").setAttribute("aria-pressed",String(mode==="light"));document.getElementById("dark-theme").setAttribute("aria-pressed",String(mode==="dark"));const wheel=document.querySelector(".wheel-frame");if(wheel){wheel.outerHTML=wheelMarkup().match(/<div class="wheel-frame">[\s\S]*?<\/div>/)[0];}}
try{setTheme(localStorage.getItem("dbt-companion-theme")||"light")}catch(e){setTheme("light")}


// Find Support: all provider searches are user-initiated. ZIP and location are never stored.
const supportKinds=[['Therapists & counselors','mental health therapist counselor'],['DBT programs','dialectical behavior therapy DBT'],['Psychiatry & medication','psychiatrist mental health clinic'],['Substance-use support','substance use treatment counseling'],['Community mental health','community mental health center'],['Crisis walk-in centers','behavioral health crisis center']];
let supportArea='',supportKind=1;
function supportMapsUrl(query,area){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(query+(area?' near '+area:' near me'));}
function supportMarkup(){return `<h2>Find Support</h2><p>Find mental health care and other support near you. Choose a service and a ZIP code, or search near your current location.</p><div class="card support-search"><h3>🗺️ Search for nearby help</h3><div class="support-crisis-shortcut"><strong>Need immediate emotional support?</strong><div class="support-actions"><a href="tel:988">📞 Call 988</a><a href="sms:988">💬 Text 988</a></div><small>U.S. 988 Lifeline, available 24/7. In immediate danger, call 911.</small></div><label for="supportZip">U.S. ZIP code (optional)</label><input id="supportZip" inputmode="numeric" maxlength="5" pattern="[0-9]{5}" placeholder="e.g., 63901" value="${escapeHTML(supportArea)}"><label for="supportType">What kind of support?</label><select id="supportType" onchange="supportToggleDBT()">${supportKinds.map((k,i)=>`<option value="${i}" ${i===supportKind?'selected':''}>${escapeHTML(k[0])}</option>`).join('')}</select><div class="support-actions"><button class="primary" onclick="supportSearchZip()">🔎 Open map for ZIP code</button><button onclick="supportSearchNearMe()">📍 Open map near me</button></div><p id="supportStatus" class="support-status" role="status">Tap either search button to open Google Maps.</p><div id="supportDBTExtra" class="support-dbt-extra" style="${supportKind===1?'':'display:none;'}"><p><strong>Looking for DBT?</strong> A DBT-specific search may miss clinics that offer it. Try a broader search and ask whether they provide individual DBT, DBT skills groups, or both.</p><div class="support-actions"><button type="button" onclick="supportSearchBroadDBT('zip')">🏥 Clinics by ZIP code</button><button type="button" onclick="supportSearchBroadDBT('near')">📍 Clinics near me</button></div><p class="muted"><small>Not every mental health clinic offers DBT. Confirm directly with the provider.</small></p></div><p class="muted"><small>Results open in Google Maps, where you can view an interactive map, provider details, phone numbers, directions and reviews. Availability, credentials, insurance and costs should be confirmed with the provider. No ZIP code or precise location is saved by this app.</small></p></div><details class="card support-fold support-verified"><summary>📍 Direct provider listings — Poplar Bluff, Missouri</summary><div class="support-fold-body"><p>These locations are listed by the providers or Missouri behavioral health organizations, even if a general Google Maps search misses them. They are examples for this area, not a complete nationwide directory.</p><div class="support-resource card"><h4>FCC Behavioral Health — Urgent Behavioral Health Crisis Center</h4><p>Walk-in behavioral health crisis support for ages 10+. Daily 10 a.m.–8 p.m.; last walk-in at 7 p.m.</p><p><b>686 Lester Street, Poplar Bluff, MO 63901</b></p><p><a href="tel:15738182642">📞 (573) 818-2642</a> · <a href="https://www.google.com/maps/search/?api=1&amp;query=686%20Lester%20Street%20Poplar%20Bluff%20MO%2063901" target="_blank" rel="noopener noreferrer">🗺️ Map &amp; directions ↗</a> · <a href="https://fccinc.org/crisis-services/" target="_blank" rel="noopener noreferrer">Official website ↗</a></p></div><div class="support-resource card"><h4>FCC Behavioral Health — Butler County Behavioral Health Clinic</h4><p>Behavioral health clinic. Call to confirm services, appointments and eligibility.</p><p><b>3001 Warrior Lane, Poplar Bluff, MO 63901</b></p><p><a href="tel:15736861200">📞 (573) 686-1200</a> · <a href="https://www.google.com/maps/search/?api=1&amp;query=3001%20Warrior%20Lane%20Poplar%20Bluff%20MO%2063901" target="_blank" rel="noopener noreferrer">🗺️ Map &amp; directions ↗</a> · <a href="https://fccinc.org/behavioral-health/clinics/" target="_blank" rel="noopener noreferrer">Official website ↗</a></p></div><p class="muted"><small>Locations and hours may change. Confirm before traveling. Listings are informational, not endorsements.</small></p></div></details><details class="card support-fold"><summary>🔎 Official treatment directories — nationwide</summary><div class="support-fold-body"><p>If a clinic is missing from Google Maps, try these directories too:</p><p><a href="https://findtreatment.gov/locator" target="_blank" rel="noopener noreferrer">SAMHSA FindTreatment.gov — search mental health and substance-use providers ↗</a></p><p><a href="https://dmh.mo.gov/behavioral-health/treatment-services/locate" target="_blank" rel="noopener noreferrer">Missouri Department of Mental Health — find treatment services ↗</a></p><p><a href="https://www.mobhc.org/bhcc-locations" target="_blank" rel="noopener noreferrer">Missouri Behavioral Health Council — crisis center locations ↗</a></p><p class="muted"><small>These directories open their own websites and maps. DBT Companion does not collect or save your searches.</small></p></div></details><details class="card support-fold"><summary>☎️ Nationwide resources (U.S.)</summary><div class="support-fold-body"><div class="support-resource card"><h4>988 Suicide &amp; Crisis Lifeline</h4><p>Free, confidential emotional crisis support, 24/7. You do not need to be suicidal to contact 988.</p><p><a href="tel:988">📞 Call 988</a> · <a href="sms:988">💬 Text 988</a> · <a href="https://988lifeline.org/" target="_blank" rel="noopener noreferrer">Website ↗</a></p></div><div class="support-resource card"><h4>SAMHSA National Helpline</h4><p>Free, confidential treatment referrals and information for mental health and substance-use concerns, 24/7.</p><p><a href="tel:18006624357">📞 1-800-662-HELP (4357)</a> · <a href="https://findtreatment.gov/" target="_blank" rel="noopener noreferrer">FindTreatment.gov ↗</a></p></div><div class="support-resource card"><h4>211 Community Services</h4><p>Ask about local community resources, housing, food, and other support. Availability varies by region.</p><p><a href="tel:211">📞 Call 211</a> · <a href="https://www.211.org/" target="_blank" rel="noopener noreferrer">211.org ↗</a></p></div><p class="muted"><small>In immediate danger, call 911 (U.S.). This directory is a starting point, not an endorsement of any provider or a replacement for professional care.</small></p></div></details>`;}
function supportToggleDBT(){const el=document.getElementById('supportDBTExtra');if(el)el.style.display=document.getElementById('supportType').value==='1'?'':'none';}
function supportSearchBroadDBT(where){const status=document.getElementById('supportStatus');let area='';if(where==='zip'){const zip=document.getElementById('supportZip').value.trim();if(!/^\d{5}$/.test(zip)){status.textContent='Please enter a five-digit U.S. ZIP code first.';return;}area=zip;supportArea=zip;}else{supportArea='';}status.textContent='Opening a broader mental health clinic search…';window.location.href=supportMapsUrl('mental health clinic counseling center',area);}
function supportSelection(){supportKind=Number(document.getElementById('supportType').value);return supportKinds[supportKind][1];}
function supportOpenMap(area){const url=supportMapsUrl(supportSelection(),area);window.location.href=url;}
function supportSearchZip(){const zip=document.getElementById('supportZip').value.trim(),status=document.getElementById('supportStatus');if(!/^\d{5}$/.test(zip)){status.textContent='Please enter a five-digit U.S. ZIP code first.';return;}supportArea=zip;status.textContent='Opening Google Maps for ZIP '+zip+'…';supportOpenMap(zip);}
function supportSearchNearMe(){supportArea='';document.getElementById('supportStatus').textContent='Opening Google Maps near your location…';supportOpenMap('');}

const tabs=['Home','Start Here','Privacy & Data','Help Me Now','Find Support','Skills','Reflective Listening','Chain Analysis','Diary Card','My Saved Work','Journal','Reflection Jar','About DBT'];let tab='Home';const emotionGroups={'Anger':['Annoyed','Irritated','Frustrated','Resentful','Bitter','Furious','Enraged','Indignant','Jealous','Hostile'],'Sadness':['Sad','Disappointed','Hurt','Lonely','Grieving','Hopeless','Discouraged','Rejected','Empty','Heartbroken'],'Fear':['Anxious','Worried','Nervous','Scared','Panicked','Insecure','Overwhelmed','Dread','Vulnerable','Uneasy'],'Shame & guilt':['Ashamed','Guilty','Embarrassed','Humiliated','Regretful','Self-conscious','Remorseful'],'Joy & connection':['Happy','Excited','Grateful','Proud','Loved','Hopeful','Peaceful','Content','Relieved','Playful','Confident'],'Other feelings':['Confused','Surprised','Numb','Bored','Disgusted','Curious','Exhausted','Restless','Apathetic','Tender','Amazed']};let selectedEmotions=[],emotionIntensities={},customEmotion='',emotionView='wheel',emotionCategory='Anger',emotionSearch='';
const darkEmotionColors={'Anger':'#c96c48','Sadness':'#438db7','Fear':'#9270c0','Shame & guilt':'#ba6895','Joy & connection':'#c69f35','Other feelings':'#389f89'};
const emotionColors={'Anger':'#f77d48','Sadness':'#56b5ef','Fear':'#b990e9','Shame & guilt':'#ed87b1','Joy & connection':'#f6ca37','Other feelings':'#50d5b0'};
function wheelPath(cx,cy,r1,r2,a1,a2){const xy=(r,a)=>[cx+r*Math.cos(a),cy+r*Math.sin(a)];let p1=xy(r2,a1),p2=xy(r2,a2),p3=xy(r1,a2),p4=xy(r1,a1);return `M${p1} A${r2} ${r2} 0 ${a2-a1>Math.PI?1:0} 1 ${p2} L${p3} A${r1} ${r1} 0 ${a2-a1>Math.PI?1:0} 0 ${p4} Z`}
function wheelMarkup(){let cats=Object.keys(emotionGroups),cx=190,cy=190;return `<div class="wheel-frame"><svg viewBox="0 0 380 380" role="group" aria-label="Interactive feelings wheel. Select a category to explore emotions.">${cats.map((cat,i)=>{let a1=-Math.PI/2+i*2*Math.PI/cats.length,a2=a1+2*Math.PI/cats.length,mid=(a1+a2)/2,tx=cx+123*Math.cos(mid),ty=cy+123*Math.sin(mid);return `<g><path tabindex="0" role="button" aria-label="Explore ${cat}" class="wheel-slice" fill="${document.documentElement.dataset.theme==='dark'?darkEmotionColors[cat]:emotionColors[cat]}" d="${wheelPath(cx,cy,57,177,a1,a2)}" onclick="pickCategory('${cat}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();pickCategory('${cat}')}"><title>${cat}</title></path><text class="wheel-label" x="${tx}" y="${ty}" text-anchor="middle">${cat==='Joy & connection'?'Joy':cat==='Shame & guilt'?'Shame':cat==='Other feelings'?'Other':cat}</text></g>`}).join('')}<circle cx="190" cy="190" r="55" fill="#fffaf0" stroke="#fff" stroke-width="4"/><text x="190" y="185" text-anchor="middle" class="wheel-center">What am I</text><text x="190" y="202" text-anchor="middle" class="wheel-center">feeling?</text></svg></div><p class="emotion-help">Tap a colored section, then choose the specific feelings that fit. You can choose from several categories.</p>`}
function emotionMarkup(){return `<div class="emotion-group"><h3>Explore your feelings</h3><p class="emotion-help">There are no wrong feelings. Select more than one and rate each one from 0 to 10.</p><div class="emotion-toolbar"><button type="button" class="${emotionView==='wheel'?'primary':''}" onclick="switchEmotionView('wheel')">◉ Feelings wheel</button><button type="button" class="${emotionView==='list'?'primary':''}" onclick="switchEmotionView('list')">☷ Searchable list</button></div><div id="emotionBrowser">${emotionBrowserMarkup()}</div><div id="emotionSelections">${selectedEmotionMarkup()}</div><label for="customEmotion">Don't see your feeling? Add your own</label><div style="display:flex;gap:8px"><input id="customEmotion" placeholder="Another feeling..." value="${escapeHTML(customEmotion)}" oninput="customEmotion=this.value"><button type="button" onclick="addCustomEmotion()">Add</button></div></div>`}
function emotionBrowserMarkup(){if(emotionView==='wheel')return wheelMarkup()+categoryMarkup();return `<label for="emotionSearch">Search all feelings</label><input id="emotionSearch" placeholder="Try: resentful, hopeful, overwhelmed..." value="${escapeHTML(emotionSearch)}" oninput="emotionSearch=this.value;updateEmotionList()"><div id="emotionList">${emotionListMarkup()}</div>`}
function categoryMarkup(){return `<h3>${escapeHTML(emotionCategory)}</h3><div>${emotionGroups[emotionCategory].map(word=>emotionChoiceMarkup(word)).join('')}</div>`}
function emotionListMarkup(){let q=emotionSearch.trim().toLowerCase();let words=Object.entries(emotionGroups).flatMap(([cat,ws])=>ws.filter(w=>!q||w.toLowerCase().includes(q)||cat.toLowerCase().includes(q)));return words.length?words.map(emotionChoiceMarkup).join(''):'<p>No matches. You can add your own feeling below.</p>'}
function emotionChoiceMarkup(word){let active=selectedEmotions.includes(word);return `<div class="emotion-choice ${active?'selected':''}"><button type="button" aria-pressed="${active}" onclick="toggleEmotion('${word.replace(/'/g,"\'")}')">${active?'✓ ': '+ '}${escapeHTML(word)}</button>${active?`<label style="margin:0;font-size:13px" for="int-${word.replace(/[^a-zA-Z]/g,'')}">Intensity <input aria-label="${escapeHTML(word)} intensity from 0 to 10" id="int-${word.replace(/[^a-zA-Z]/g,'')}" type="number" min="0" max="10" value="${emotionIntensities[word]??5}" onchange="setEmotionIntensity('${word.replace(/'/g,"\'")}',this.value)"></label>`:''}</div>`}
function selectedEmotionMarkup(){return `<h3>My selected feelings (${selectedEmotions.length})</h3>${selectedEmotions.length?selectedEmotions.map(word=>`<span class="emotion-pill">${escapeHTML(word)} · ${emotionIntensities[word]??5}/10 <button type="button" aria-label="Remove ${escapeHTML(word)}" onclick="toggleEmotion('${word.replace(/'/g,"\'")}')">×</button></span>`).join(''):'<p class="emotion-help">No feelings selected yet.</p>'}`}
function updateEmotionBrowser(){let b=document.getElementById('emotionBrowser');if(b)b.innerHTML=emotionBrowserMarkup();let t=document.getElementById('emotionSelections');if(t)t.innerHTML=selectedEmotionMarkup()}
function switchEmotionView(view){emotionView=view;let host=document.querySelector('.emotion-group');if(host)host.outerHTML=emotionMarkup()}
function pickCategory(cat){emotionCategory=cat;updateEmotionBrowser()}
function updateEmotionList(){let e=document.getElementById('emotionList');if(e)e.innerHTML=emotionListMarkup()}
function toggleEmotion(word){if(selectedEmotions.includes(word))selectedEmotions=selectedEmotions.filter(w=>w!==word);else{selectedEmotions.push(word);emotionIntensities[word]=5}updateEmotionBrowser()}
function setEmotionIntensity(word,value){emotionIntensities[word]=Math.max(0,Math.min(10,Number(value)||0));let t=document.getElementById('emotionSelections');if(t)t.innerHTML=selectedEmotionMarkup()}
function addCustomEmotion(){let word=customEmotion.trim().slice(0,50);if(!word)return;if(!selectedEmotions.includes(word)){selectedEmotions.push(word);emotionIntensities[word]=5}customEmotion='';let el=document.getElementById('customEmotion');if(el)el.value='';updateEmotionBrowser()}

const content=document.getElementById('content'),nav=document.getElementById('nav');const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function go(t){if(tab==='Chain Analysis')saveChainField();tab=t;render();window.scrollTo(0,0)}function render(){nav.innerHTML=tabs.map(t=>`<button class="${t===tab?'active':''}" onclick="go('${t}')">${t}</button>`).join('');let html='';if(tab==='Reflective Listening')html=listeningMarkup();if(tab==='Start Here')html=welcomeGuideMarkup();if(tab==='Privacy & Data')html=privacyGuideMarkup();if(tab==='Home')html=`<h2>Welcome</h2><div class="card"><span class="tag">Start here</span><h2>What do you need today?</h2><p>You don't have to figure everything out at once.</p><button class="primary" onclick="go('Help Me Now')">I need help right now</button> <button onclick="go('Diary Card')">Daily check-in</button></div><div class="card"><h3>Practice, not perfection</h3><p>DBT is about building skills over time. A hard moment doesn't erase your progress.</p></div>`;if(tab==='Find Support')html=supportMarkup();if(tab==='Help Me Now')html=`<h2>Help Me Now</h2><div class="card crisis-card"><h3>Need to talk to someone right now?</h3><p>In the U.S., the 988 Suicide &amp; Crisis Lifeline offers free, confidential support 24/7. You don't have to be suicidal to reach out.</p><div class="crisis-actions"><a class="crisis-action" href="tel:988" aria-label="Call the 988 Lifeline">📞 Call 988</a><a class="crisis-action" href="sms:988" aria-label="Text the 988 Lifeline">💬 Text 988</a></div><p class="crisis-note">Tapping opens your phone's calling or messaging app; you choose whether to place the call or send the text. If there is immediate danger, call 911.</p></div><details class="card privacy-fold"><summary>🛑 Practice STOP</summary><p>Tap the STOP sign to practice, one step at a time.</p>${stopMarkup()}</details><details class="card privacy-fold"><summary>🌿 Grounding: 5–4–3–2–1</summary><p>Name 5 things you see, 4 you feel, 3 you hear, 2 you smell, and 1 you taste. Adapt or skip senses that aren't comfortable.</p></details><details class="card privacy-fold"><summary>🌬️ Temperature and paced breathing</summary><p>Try cool water on your hands or face and a gentle, slower exhale. Avoid extreme temperatures or breath-holding if medically unsafe for you.</p></details><details class="card privacy-fold"><summary>🧩 More ways to get through this moment</summary><p>Pick just one. You can try it for about a minute, or longer if it helps.</p><details class="quick-coping"><summary>🌿 Self-Soothe — find a little comfort</summary><p>Choose one sense that feels safe and pleasant right now.</p><ol><li>Look at a favorite photo or something beautiful.</li><li>Listen to a comforting song, or notice a soothing sound.</li><li>Hold a soft blanket or enjoy a familiar scent.</li></ol><p><b>Try now:</b> Spend one minute noticing just one comforting sensation.</p></details><details class="quick-coping"><summary>🧩 ACCEPTS — give your mind a short break</summary><p>Distracting yourself briefly can help you get through an intense moment. You can return to the problem later.</p><ol><li>Choose a simple activity: sort photos, fold a few towels, or play a quick word game.</li><li>Or count backward from 100 by threes.</li><li>Notice whether the urge feels any different after a minute.</li></ol><p><b>Try now:</b> Choose one distraction and give it sixty seconds.</p></details><details class="quick-coping"><summary>✨ IMPROVE the Moment — make this minute easier</summary><p>You don't have to fix everything right now.</p><ol><li>Imagine a place where you feel peaceful.</li><li>Relax your shoulders if comfortable, and take a gentle breath.</li><li>Tell yourself: “I only need to handle this moment.”</li></ol><p><b>Try now:</b> Picture that peaceful place for one minute.</p></details><details class="quick-coping"><summary>⚖️ Pros and Cons — pause before acting on an urge</summary><p>When you want to react immediately, compare what might happen next.</p><ol><li>What might I gain right away if I act on this urge?</li><li>What might it cost me later?</li><li>What might I gain by waiting or choosing a skill instead?</li></ol><p><b>Try now:</b> Name one short-term benefit and one longer-term cost before deciding.</p></details><p class="muted"><small>These are brief starting points, not the full skills. Open the Skills Library whenever you want more detail. If a suggestion doesn't fit your situation, skip it.</small></p></details><details class="card privacy-fold"><summary>🎧 Guided meditation and calming videos</summary><p>Optional videos that open in YouTube. Choose one if listening feels helpful right now; nothing plays automatically.</p><p><a href="https://www.youtube.com/watch?v=q4oqk5spCXY" target="_blank" rel="noopener noreferrer">5-minute grounding meditation ↗</a></p><p><a href="https://www.youtube.com/watch?v=TXNECaIJPDI" target="_blank" rel="noopener noreferrer">5-minute guided breathing exercise ↗</a></p><small>Videos require an internet connection and may include ads. Skip any exercise that feels uncomfortable.</small></details>`;if(tab==='Skills')html=`<h2>DBT Skills Library</h2><p>Tap a module to explore its purpose, skills, and ways to practice.</p>${skillModules.map(m=>`<details class="skill-module"><summary>${m.icon} ${m.name}</summary><div class="skill-body"><p><b>What it is:</b> ${m.what}</p><p><b>Goal:</b> ${m.goal}</p>${m.skills.map(sk=>sk[0]==='PLEASE'?pleaseMarkup():skillAcronyms[sk[0]]?acronymMarkup(sk[0]):`<h4>${sk[0]}</h4><p>${sk[1]}</p>`).join('')}${m.name==='Distress Tolerance'?'<button class="primary" onclick="go(\'Help Me Now\')">Practice STOP with the stop sign →</button>':''}</div></details>`).join('')}`;if(tab==='Chain Analysis')html=`<h2>Behavior Chain Analysis</h2><p>Explore what happened without blame. Choose the format that works for you.</p><details class="chain-sample"><summary>See a complete example first (optional)</summary><p class="muted">This is one imaginary situation, not a model you have to copy.</p>${chainQuestions.map((q,i)=>`<div class="chain-sample-step"><b>${i+1}. ${escapeHTML(q.title)}</b><p>${escapeHTML(q.full)}</p></div>`).join('')}</details><div class="card"><h3>Choose your path</h3><button class="${chainMode==='guided'?'primary':''}" onclick="setChainMode('guided')">Guided Deep Dive</button> <button class="${chainMode==='quick'?'primary':''}" onclick="setChainMode('quick')">Quick Worksheet</button></div>${chainMode==='guided'?guidedMarkup():quickMarkup()}`;if(tab==='My Saved Work')html=savedWorkMarkup();if(tab==='Diary Card')html=diaryMarkup();if(tab==='Reflection Jar')html=`<h2>Reflection Jar</h2><p>Draw a card, share what it means to you, and choose something to practice this week.</p><div class="jar-stage"><svg class="mason-jar" viewBox="0 0 260 295" role="img" aria-label="Mason jar filled with colorful reflection cards"><rect x="62" y="15" width="136" height="24" rx="6" fill="#a6e4e5" stroke="#396b85" stroke-width="5"/><path d="M65 39 L65 62 Q39 73 39 106 L39 239 Q39 277 77 277 L183 277 Q221 277 221 239 L221 106 Q221 73 195 62 L195 39 Z" fill="#e6fbff88" stroke="#3d8b9b" stroke-width="6"/><g transform="rotate(-13 96 156)"><rect x="63" y="120" width="67" height="93" rx="8" fill="#ffcc59" stroke="#e59a34" stroke-width="3"/></g><g transform="rotate(15 167 164)"><rect x="133" y="117" width="65" height="96" rx="8" fill="#fa7ca4" stroke="#d64f7e" stroke-width="3"/></g><g transform="rotate(-2 132 190)"><rect x="103" y="147" width="66" height="100" rx="8" fill="#a985f5" stroke="#8052b8" stroke-width="3"/></g><path d="M55 92 Q130 68 206 92" fill="none" stroke="#fff" stroke-width="7" opacity=".65"/><text x="130" y="262" text-anchor="middle" font-size="17" font-weight="bold" fill="#316c7b">REFLECT</text></svg><button class="jar-draw" onclick="drawCard()">✦ Draw a card</button></div><div class="jar-card" style="text-align:center" aria-live="polite"><span class="tag" id="cardcategory">Reflection</span><h2 id="cardtext">Your next reflection is waiting.</h2><p id="cardhint">Draw a card to begin.</p></div><div class="jar-controls"><button onclick="flipCard()">↻ Flip card</button></div><label for="shareMeaning">What does this card mean to you right now?</label><textarea id="shareMeaning" placeholder="What would you share with your group?" oninput="saveReflectionDraft()"></textarea><label for="focus">What would you like to work on this week?</label><textarea id="focus" placeholder="One small step I can practice..." oninput="saveReflectionDraft()"></textarea><p><button class="primary" onclick="saveReflectionEntry()">Save reflection</button> <button onclick="downloadReflection()">Download my reflection</button> <button onclick="clearReflectionDraft()">Clear draft</button></p><small>Original prompts inspired by group reflection activities. Drafts are kept while switching app sections when browser storage works. Saved reflections are included in complete JSON backups. Browser storage is not guaranteed between downloaded HTML sessions.</small>`;if(tab==='About DBT')html=`<h2>About DBT</h2><div class="card"><span class="tag">The origins</span><h3>Meet Dr. Marsha M. Linehan</h3><p>Psychologist Dr. Marsha M. Linehan developed Dialectical Behavior Therapy (DBT). DBT combines acceptance and change: you can acknowledge your experience as it is while learning ways to respond differently.</p><p>DBT was originally developed for people experiencing chronic suicidality and intense emotional distress. Its skills are now taught in a range of settings.</p></div><div class="card"><h3>What does “dialectical” mean?</h3><p>Two things that seem opposite can both be true. For example: “My feelings make sense, and I can choose how I respond.”</p></div><div class="card"><h3>Learn DBT in everyday language</h3><p>Our beginner questions explain DBT terms as you go. Experienced learners can use familiar worksheet wording instead. Switch at any time.</p><p><small>This is an independent educational app, not affiliated with or endorsed by Dr. Linehan or her organizations. Our explanations and reflection cards are original, not reproductions of published DBT worksheets.</small></p></div>`;if(tab==='Journal')html=`<h2>My Journal</h2><p>Write freely. Your draft is kept while you move between app sections. Tap <b>Save entry</b> to add it to My Saved Work, then download a complete JSON backup to carry it to another app copy.</p><label for="journal">Today's reflection</label><textarea id="journal" style="min-height:210px" placeholder="What's on your mind?" oninput="saveJournalDraft(this.value)"></textarea><p><small id="journal-save-status" role="status">Draft storage depends on your browser. Save an entry and download a backup to keep it.</small></p><p><button class="primary" onclick="saveJournalEntry()">Save entry</button> <button onclick="downloadJournal()">Download entry</button> <button onclick="clearJournalDraft()">Clear draft</button></p><p><small>Saved entries are not encrypted. A downloaded JSON backup includes saved entries, not unsaved draft text.</small></p>`;content.innerHTML=html;if(tab==='Journal')restoreJournalDraft();if(tab==='Reflection Jar')restoreReflectionDraft();if(tab==='Diary Card'){}}
/* Reflective Listening: selectable scenarios, no scoring. */
const listeningScenarios=[
 {title:'A Friend Feels Ignored',level:1,rounds:[
 {says:'“I feel like nobody really listens to me lately. I start talking, and everyone seems to have something more important to do.”',ask:'What feeling might be underneath those words?',choices:[['Hurt and overlooked','That could fit. The friend seems to want to feel heard and important.'],['Angry at everyone','Anger may be part of it, and there may be hurt underneath.'],['Bored with the conversation','That is possible, though the words point more toward feeling dismissed.']]},
 {says:'“I tried telling my sister about my day, and she started checking her phone before I finished.”',ask:'How could you reflect what you heard?',choices:[['“It sounds like you felt brushed aside when she looked at her phone.”','This reflects the experience without trying to fix it.'],['“You should tell her to put her phone away.”','That might be an option later. First, try showing you understand the feeling.'],['“I know exactly how you feel. My sister does that too.”','Relating can build connection, and it may shift the focus away from your friend.']]},
 {says:'“Actually, sometimes you interrupt me too. I don’t think you mean to, and it still hurts.”',ask:'How might you respond without getting defensive?',choices:[['“Thank you for telling me. I can see how that would hurt. I want to do better at listening.”','This acknowledges the impact and leaves room to improve.'],['“I only interrupt because I get excited.”','That explains your intention, and it may leave your friend feeling unheard.'],['“Well, you interrupt me sometimes too.”','That shifts the conversation toward blame rather than listening.']]}]},
 {title:'Someone Gives Unwanted Advice',level:1,rounds:[
 {says:'“You sounded upset earlier, so I started telling you what I thought you should do. I was just trying to help.”',ask:'What might this person be trying to communicate?',choices:[['They wanted to help, even if the advice was not what I needed','You can recognize a helpful intention without pretending the advice felt good.'],['They were deliberately trying to upset me','That is one possibility, though their words suggest they believe they were helping.'],['I have to take their advice to be polite','Listening to someone does not mean you have to follow their advice.']]},
 {says:'“I guess I did jump straight into solutions. I thought that was what you wanted.”',ask:'How could you respond while making your needs clear?',choices:[['“I know you were trying to help. Sometimes I just need you to listen before we talk about solutions.”','This acknowledges their intention and clearly explains what would help.'],['“You never listen. You always have to fix everything.”','That communicates frustration, and the broad accusation may make it harder for them to hear your request.'],['“Never mind. It does not matter.”','That may end the discomfort quickly, though it leaves your needs unclear.']]},
 {says:'“Okay, I can try that. What should I do if I am not sure whether you want advice?”',ask:'What could you suggest that works for both of you?',choices:[['“You could ask, ‘Do you want me to listen or help brainstorm?’ That would mean a lot.”','This gives them a practical way to support you while keeping communication open.'],['“Just never give me advice again.”','A firm boundary may be needed sometimes, though this misses the chance to agree on a flexible approach.'],['“You should already know what I need.”','It can feel frustrating to explain, and a clear request usually gives the other person a better chance to respond well.']]}]},
 {title:'A Friend Cancels Plans',level:1,rounds:[
 {says:'“I know I canceled again. I have so much going on, and I feel like I keep disappointing everybody.”',ask:'What might your friend be feeling?',choices:[['Overwhelmed and guilty','That fits what your friend is describing.'],['Careless about plans','The words suggest they care and are struggling.'],['Angry at you','There is no clear sign of anger toward you here.']]},
 {says:'“I wanted to come. By the time I got home, I had nothing left in me.”',ask:'Which response shows you heard them?',choices:[['“You really wanted to be there, and you were completely drained.”','You reflected both their intention and their exhaustion.'],['“You need to organize your time better.”','That offers advice before acknowledging their experience.'],['“It is fine, forget it.”','That may reassure them, though it does not show much understanding.']]},
 {says:'“I was worried you would think I just did not want to see you.”',ask:'What could you say next?',choices:[['“You were afraid I would take it personally. Thanks for telling me.”','You acknowledge the worry without making assumptions.'],['“You worry too much.”','That may unintentionally dismiss their concern.'],['“Well, it did hurt my feelings.”','Your feelings can matter too; reflecting theirs first may help the conversation.']]}]}
 ,{title:'Someone Gets Defensive',level:1,rounds:[
 {says:'“So now I’m the bad guy? I was only joking. You make it sound like I’m always doing something wrong.”',ask:'What might be happening for this person?',choices:[['They may feel criticized or misunderstood','That may explain the defensive response. You can notice it without ignoring your own feelings.'],['They clearly do not care about my feelings','That is one possibility, and their reaction alone does not tell us everything they feel.'],['I must take back what I said','You can acknowledge their feelings while still being honest about your experience.']]},
 {says:'“I just hate feeling like I can never say anything right around you.”',ask:'How could you reflect their feelings without abandoning yours?',choices:[['“It sounds like you feel judged, and that’s not what I want. I’d still like to explain what hurt me.”','You reflect their concern and keep room for both experiences.'],['“You’re being ridiculous. That isn’t what I said.”','That may make the other person feel even less heard.'],['“Okay, forget I brought it up.”','That may lower tension for now, and it also leaves your concern unspoken.']]},
 {says:'“All right. I didn’t realize that joke bothered you. I’m listening. What was it like for you?”',ask:'What could you say to keep the conversation open?',choices:[['“Thanks for hearing me. I felt embarrassed when everyone laughed. I know you may not have meant it that way.”','This names the impact, acknowledges their willingness to listen, and avoids assigning intent.'],['“You should have known better than to say it.”','That expresses hurt, and it may restart the argument instead of explaining the impact.'],['“It doesn’t matter anymore.”','You can choose to stop, though this misses an opportunity to be understood.']]}]}

 ,{title:'They Say They’re Fine',level:1,rounds:[
 {says:'“I’m fine.” Your friend looks away, folds their arms, and gets unusually quiet.',ask:'What can you notice without deciding you know what they feel?',choices:[['Their words say one thing, and their body language seems different','You are noticing a difference without assuming what it means.'],['They are definitely angry with me','That might be true, and you do not have enough information to know.'],['If they say fine, I should tell them to cheer up','That could skip over what they may be experiencing.']]},
 {says:'“I said I’m fine. I just don’t feel like talking about it right now.”',ask:'How could you show you heard their boundary?',choices:[['“Okay. I won’t push. I’m here if you want to talk later.”','You respect their choice and leave the door open.'],['“Come on, I can tell something is wrong. Just tell me.”','That may feel like pressure when they have asked for space.'],['“Well, I guess you don’t trust me.”','That shifts attention to your feelings and could make them feel responsible for reassuring you.']]},
 {says:'“Thanks. It’s been a rough day, and I need a little time before I can explain it.”',ask:'What response makes room for their needs and keeps the connection?',choices:[['“That sounds like a lot. Take the time you need. I’m glad you told me.”','You acknowledge their experience and respect their pace.'],['“See? I knew you weren’t fine!”','You may be right about the words, and proving it is less important than hearing them.'],['“Okay, but you need to tell me what happened tonight.”','That puts a deadline on a conversation they have not agreed to have.']]}]}

 ,{title:'You’re Being Too Sensitive',level:2,rounds:[
 {says:'Your partner makes a snarky comment about something you did. You say it hurt. Your partner replies, “Oh, come on. You’re being way too sensitive. I was only joking.”',ask:'How could you respond without accepting that label or escalating the argument?',choices:[
 ['“I hear that you meant it as a joke. It still hurt my feelings, and I’d like you to understand that.”','You acknowledge what your partner said they intended and make room for the impact on you. Both can be true.'],
 ['“You’re just a jerk, and you always do this.”','That communicates anger, though the label and “always” may shift the focus into another argument.'],
 ['“You’re right. I guess I shouldn’t have said anything.”','That may end the disagreement quickly, though it leaves your hurt unaddressed.']]},
 {says:'Your partner sighs and says, “I feel like I can’t say anything around you without you getting upset.”',ask:'What could you reflect while still standing up for yourself?',choices:[
 ['“It sounds like you feel you have to watch what you say. I’m not asking you to be silent; I’m asking you to take me seriously when something hurts.”','You reflect their concern without giving up your own. Listening is not the same as agreeing.'],
 ['“Then maybe you should stop talking altogether.”','That response may feel satisfying in the moment, and it does not help your partner hear what you need.'],
 ['“Never mind. I’ll just keep my feelings to myself.”','Withdrawing may feel safer, though it leaves the problem unresolved.']]},
 {says:'Your partner says, “So what am I supposed to do? Just never say anything again? I guess I can’t even speak without you getting upset.”',ask:'How could you make a clear, realistic request?',choices:[
 ['“I’m not asking you to stop speaking. I’m asking you to hear me when something hurts instead of calling me too sensitive.”','You clarify what you are asking for without accepting the idea that your partner must stay silent.'],
 ['“You should know exactly what I need without me explaining it.”','Wanting to be understood makes sense, though a specific request gives your partner something concrete to respond to.'],
 ['“Forget it. It’s not worth talking about.”','You can choose to pause the conversation, and you also deserve the option to revisit it later.']]}]}

 ,{title:'A Family Member Dismisses Your Concern',level:2,speaker:'Your family member',rounds:[
 {says:'“You keep bringing up the same problem. I don’t see why it matters so much.”',ask:'How could you respond without dismissing their frustration or giving up your concern?',choices:[
 ['“I hear that you’re tired of talking about it. It matters to me because it keeps happening, and I’d like us to find a way forward.”','You reflect their frustration and explain why the concern still needs attention.'],
 ['“You never care about anything that bothers me.”','That shows how hurt you feel, and the word “never” can pull the conversation into a fight about past events.'],
 ['“You’re right. I’ll stop mentioning it.”','You may decide to pause, though you do not have to abandon an ongoing concern just because someone is frustrated.']]},
 {says:'“I have enough on my plate already. Now you’re saying I’m doing everything wrong?”',ask:'What could you say to show you heard them without agreeing with that interpretation?',choices:[
 ['“It sounds like you’re overwhelmed and hearing this as criticism. I’m talking about one specific thing, not everything you do.”','This recognizes their experience and gently brings the discussion back to the issue.'],
 ['“If you’d just listen for once, you’d know that’s not what I said.”','That may be tempting, though it can make it harder for them to hear your actual point.'],
 ['“Fine, I guess I shouldn’t ask you for anything.”','That may end the conversation, and it does not communicate what you need.']]},
 {says:'“Well, what do you actually want me to do about it?”',ask:'How could you make one clear request while keeping the conversation respectful?',choices:[
 ['“I’d like us to agree on one small change we can both follow. Can we talk about what would work?”','A specific, collaborative request makes the next step easier to understand.'],
 ['“You should already know what needs to change.”','It is understandable to want that, and saying the request aloud makes it clearer.'],
 ['“Forget it. I’ll do everything myself.”','Taking over might feel simpler now, though it may leave the original problem in place.']]}]}


 ,{title:'Everyone Assumes You’ll Handle It',level:2,speaker:'Your roommate',rounds:[
 {says:'“I’ve been busy all day, too. It’s not like I’ve just been sitting around doing nothing.”',ask:'You’re recovering from an illness and asked your roommate to handle some household chores. How could you acknowledge their day while keeping your request clear?',choices:[
 ['“I know you’ve been busy. I’m still recovering and can’t manage everything right now. Could you take care of the kitchen tonight?”','You recognize their workload and ask for one specific, manageable thing.'],
 ['“You clearly don’t care whether I get better.”','That expresses hurt, though it assumes their intentions and may turn the conversation into a fight.'],
 ['“Never mind. I’ll just do it myself.”','That may avoid an argument for now, though it could push you beyond what you can physically manage.']]},
 {says:'“So now I’m the bad guy because I didn’t do everything you wanted?”',ask:'Your roommate is hearing your request as an accusation. How could you reflect that without accepting their interpretation?',choices:[
 ['“It sounds like you feel blamed. I’m not saying you’re a bad person. I’m saying I need help with a few things while I recover.”','You acknowledge what they heard and return to your actual need.'],
 ['“If you feel like the bad guy, that’s your problem.”','That may be tempting to say, though it is likely to increase defensiveness.'],
 ['“You’re right. I shouldn’t have asked.”','You can recognize their feelings without treating your reasonable request as wrongdoing.']]},
 {says:'“Fine! I’ll do it myself. Apparently, that’s the only way to shut you up.”',ask:'Your roommate has agreed to do the task, but has insulted you. How could you respond without getting pulled into the insult or abandoning your boundary?',choices:[
 ['“I appreciate you taking care of it. I’m asking for help, not trying to nag you. And I’m not okay with being told to shut up.”','You stay clear about the task and set a boundary around how you are spoken to.'],
 ['“Well, maybe if you did your share, I wouldn’t have to say anything.”','That may express your frustration, though it risks turning the exchange into another argument.'],
 ['“Sorry. Forget I said anything. I’ll take care of it.”','That may quiet the conflict temporarily, though it leaves both your recovery needs and the insult unaddressed.']]}]}

 ,{title:'I Need Some Space',level:3,speaker:'Your adult child',rounds:[
 {says:'“I don’t want us texting every day anymore, and I don’t want phone calls right now. If you need to contact me, please send a letter instead.”',ask:'You are the parent. This is painful to hear. How could you show that you heard the boundary without negotiating it?',choices:[
 ['“I hear you. No texts or calls right now. If I need to reach you, I’ll write a letter.”','You repeat the boundary accurately and show you intend to respect it, even though it hurts.'],
 ['“But I’m your parent. Surely one quick phone call can’t hurt.”','That pushes back against a limit your adult child just made clear.'],
 ['“Fine. I guess you don’t care about me anymore.”','That expresses pain by assigning your child a feeling they did not say they had.']]},
 {says:'“Every time I try to tell you something, you get really worked up. It’s exhausting, and I can’t do this anymore. We need to have less contact for a while.”',ask:'You are the parent. How could you hear this criticism without arguing about whose version is right?',choices:[
 ['“It sounds like our conversations have been overwhelming for you. I’m sorry they’ve felt that way. I’ll give you the space you’re asking for.”','You reflect the impact they describe without having to agree with every detail of their account.'],
 ['“After everything I’ve done for you, this is how you treat me?”','That shifts the focus from their stated need to what they owe you, and can make honest communication harder.'],
 ['“That’s not true. You’re exaggerating how I react.”','Disputing their experience right now is likely to repeat the pattern they are describing.']]},
 {says:'“I’m not saying I never want a relationship with you. I’m saying I need some space, and I need you to respect that. I don’t know when I’ll be ready for more contact.”',ask:'You are the parent. How could you respond without asking for a promise about when things will change?',choices:[
 ['“I love you, and this is hard for me. I understand that you need space. I’ll respect the contact limits you’ve set, and I won’t pressure you for a timeline.”','You can name your feelings while leaving the decision about future contact with your adult child.'],
 ['“Okay, but can you at least promise we’ll talk again next month?”','A deadline may ease your uncertainty, though it pressures them to make a promise they are not ready to make.'],
 ['“Then I won’t bother trying to have a relationship with you at all.”','That turns their request for space into an all-or-nothing choice they did not make.']]}]}
 ,{title:'An Apology With an Excuse',level:2,speaker:'Your friend',rounds:[
 {says:'“I’m sorry I told everyone about what you shared with me. I just thought they should know, and you never said it was a secret.”',ask:'Your friend apologized, then explained away what happened. How could you acknowledge the apology and explain the impact?',choices:[
 ['“I hear that you thought it was okay to share. I appreciate the apology, and I felt exposed when other people knew something I told you privately.”','You reflect their explanation without treating it as a reason your feelings should disappear.'],
 ['“That’s the worst apology I’ve ever heard. You clearly don’t care about me.”','It expresses how hurt you are, though it may turn the conversation into an argument about their character.'],
 ['“Oh, okay. I guess I should’ve said it was a secret.”','That takes all the responsibility onto yourself without addressing the trust that was damaged.']]},
 {says:'“I said I was sorry! What else do you want from me? I can’t go back and change it.”',ask:'Your friend is getting defensive. How could you reflect that frustration while making your need clear?',choices:[
 ['“I know you can’t undo it, and it sounds frustrating to feel like your apology isn’t enough. I need you to understand why it hurt, not fix the past.”','You acknowledge their frustration and distinguish being heard from demanding the impossible.'],
 ['“If you were really sorry, you wouldn’t be acting like this.”','That may deepen the defensiveness instead of helping them understand what you need.'],
 ['“Never mind. I shouldn’t have brought it up.”','That may end the tension quickly, though it leaves the concern unspoken.']]},

function listeningMarkup(){if(listeningScenario<0)return listeningMenu();let sc=listeningScenarios[listeningScenario],r=sc.rounds[listeningRound];return `<h2>Reflective Listening Practice</h2><button onclick="listeningBackToMenu()">← All scenarios</button><div class="card"><span class="tag">Level ${sc.level} · Scenario ${listeningScenario+1} of ${listeningScenarios.length} available</span><h3>${escapeHTML(sc.title)}</h3><p>Practice hearing what someone means, not just the words they say. No scores, no failing.</p><div class="progress"><div style="width:${(listeningRound+1)/3*100}%"></div></div><p class="muted">Conversation ${listeningRound+1} of 3</p><div class="listen-speech"><b>${sc.speaker|| (listeningScenario===5?"Your partner":"Your friend")}:</b><p>${r.says}</p></div><h3>${r.ask}</h3><div class="listen-choices">${r.choices.map((c,i)=>`<button type="button" class="listen-choice ${listeningChoice===i?'selected':''}" aria-pressed="${listeningChoice===i}" onclick="pickListening(${i})">${escapeHTML(c[0])}</button>`).join('')}</div>${listeningChoice>=0?`<div class="listen-feedback" role="status"><b>Something to notice</b><p>${r.choices[listeningChoice][1]}</p></div>`:''}<details class="listen-help"><summary>Help me get started</summary><p>${listeningHints[listeningRound]}</p></details><label for="listeningDraft">Your own response (optional)</label><textarea id="listeningDraft" oninput="listeningDrafts[listeningRound]=this.value" placeholder="What would you say in your own words?">${escapeHTML(listeningDrafts[listeningRound])}</textarea><p class="muted"><small>Your words are for your own reflection. This version does not analyze or save them automatically.</small></p><div class="stepbuttons"><button type="button" ${listeningRound===0?'disabled':''} onclick="moveListening(-1)">← Back</button>${listeningRound<2?'<button class="primary" type="button" onclick="moveListening(1)">Continue →</button>':'<button class="primary" type="button" onclick="finishListening()">Finish function welcomeGuideMarkup(){return `<h2>Welcome to DBT Companion</h2><p>A friendly place to learn and practice DBT skills at your own pace. You do not need to know DBT to begin.</p><details class="card privacy-fold guide-green"><summary>What is DBT?</summary><p>Dialectical Behavior Therapy teaches practical ways to notice what is happening, cope with distress, understand emotions, and communicate more effectively. It balances acceptance with change: your experience matters, and you can practice a different response.</p><p>This app is a self-help learning tool, not therapy or emergency monitoring.</p></details><details class="card privacy-fold guide-berry"><summary>Four skill families</summary><p><b>Mindfulness:</b> Notice the present moment without immediately judging it.</p><p><b>Distress tolerance:</b> Get through difficult moments without making them worse.</p><p><b>Emotion regulation:</b> Understand feelings and make choices about how to respond.</p><p><b>Interpersonal effectiveness:</b> Ask for what you need and maintain relationships and self-respect.</p><button onclick="go('Skills')">Explore the skills →</button></details><details class="card privacy-fold guide-teal"><summary>Words you'll see in the Diary Card</summary><p><b>Emotion:</b> What you feel, such as anger, fear, shame, or joy.</p><p><b>Thought:</b> Words or ideas going through your mind, such as “They don't understand me.”</p><p><b>Urge:</b> Something you feel pulled to do, whether or not you act on it.</p><p><b>Behavior:</b> Something you actually did or said, such as walking away or raising your voice.</p><p><b>Skill:</b> A strategy you practiced, even if it didn't work perfectly.</p><p>These can overlap. The point is curiosity and learning, not getting every label perfect.</p></details><details class="card privacy-fold guide-red"><summary>Your first five minutes</summary><ol><li>Open <b>Skills</b> and explore one skill that sounds useful.</li><li>Try <b>Help Me Now</b> for a guided STOP practice when you want to pause.</li><li>Open <b>Diary Card</b>, select a day, and record what you want to track.</li><li>Mark skills on the checklist, then see the <b>Weekly Review</b>.</li><li>Save your work and download a private copy if you want to keep it.</li></ol><p>You can skip any question. You don't need to complete the whole diary every day.</p><button class="primary" onclick="go('Diary Card')">Try the Diary Card →</button></details><details class="card privacy-fold"><summary>Before you write personal details</summary><p>Your saved work stays in this browser on this device, where other people with access to the device or browser files may be able to see it. It is not encrypted or automatically backed up.</p><button onclick="go('Privacy & Data')">Read privacy and backup information →</button></details>`}
function privacyGuideMarkup(){return `<h2>Privacy &amp; Your Data</h2><p>Understand how this prototype handles your entries before recording personal information.</p><details class="card privacy-fold guide-green"><summary>What stays on your device?</summary><p>Saved diary weeks, practice drafts, and some app preferences use this browser's local storage. This prototype has no account system and does not automatically send those entries to the app creator, your therapist, or group members.</p><p><b>Important:</b> Browser storage is not encryption. Anyone with access to your unlocked device or its files may be able to read your entries.</p></details><details class="card privacy-fold guide-berry"><summary>Saving and downloading are different</summary><p><b>Save:</b> Keeps an entry in the current browser's local storage. Clearing browser data, changing browsers, or opening a different copy of this local HTML file can make saved work unavailable.</p><p><b>Download:</b> Creates a separate file you can keep. Downloads may contain sensitive details in readable text; store them privately and avoid sharing them accidentally.</p><p>This version does not offer automatic cloud backup. To restore a complete DBT Companion backup, open My Saved Work, select your saved .json file under Backup &amp; Restore, review the preview, and confirm. Restoring replaces the saved collections in this browser, so download a fresh backup first. Individual downloaded text files do not automatically reappear inside the app.</p><button onclick="go('My Saved Work')">Open My Saved Work →</button></details><details class="card privacy-fold guide-teal"><summary>Before sharing the app</summary><p>Share a <b>clean copy of the app ZIP</b>, not your completed diary downloads or screenshots. The app file itself does not include your saved browser entries.</p><p>Each person's browser stores their own work separately. This app does not automatically send diary entries to a therapist, group, or anyone else.</p><p>If you are using a shared phone or computer, consider whether it's safe to enter sensitive information.</p></details><details class="card privacy-fold guide-red"><summary>Safety and support</summary><p>DBT Companion is an independent educational prototype, not professional care, crisis monitoring, or an emergency service. No one is watching entries or responding to them.</p><p>If you are in immediate danger, contact local emergency services. In the United States, you can call or text <b>988</b> for suicide and crisis support.</p><p>You can leave sensitive fields blank and discuss concerns directly with a qualified professional.</p></details><details class="card privacy-fold"><summary>Our promise for the project</summary><p>The goal is to keep DBT Companion free to use. This prototype does not require an account or subscription. Future hosting or distribution would need a fresh privacy review before release.</p></details>`}

{term:'Target behavior',title:'What did you do that you would like to understand or change?',help:'Choose one specific action, rather than judging yourself as a person.',example:'I raised my voice during a disagreement.',full:'You raised your voice during a disagreement. That is the behavior you want to understand, not a label about who you are.'},

{term:'Vulnerability factors',title:'What made things harder for you that day?',help:'Think about tiredness, pain, hunger, stress, illness, or things that happened earlier.',example:'I slept poorly and was already stressed and uncomfortable.',full:'You had slept poorly and were stressed. Those circumstances made it harder to respond calmly.'},
{term:'Links in the chain',title:'What happened between that moment and your reaction?',help:'Walk through your thoughts, feelings, body sensations, urges, and actions in order. It is okay if you remember only some of them.',example:'I thought, “They think I cannot do anything right.” I felt hurt, tensed up, and started talking faster.',full:'You interpreted the comment as criticism, felt hurt, noticed tension in your body, and began speaking faster. Those are links between the event and raising your voice.'},

function pleaseMarkup(){const parts=[['PL','Treat Physical Illness','Attend to health needs, medications as prescribed, and symptoms. Ask for medical support when needed.'],['E','Balance Eating','Eat regularly and in ways that work for your health, resources, and individual needs.'],['A','Avoid Mood-Altering Substances','Notice how alcohol, drugs, and other substances may affect mood and choices. Seek support if changing use is difficult.'],['S','Balance Sleep','Aim for a sustainable sleep routine and enough rest for your circumstances.'],['E','Get Exercise','Choose safe, accessible movement that fits your body and abilities; small amounts count.']];return `<details class="please-skill"><summary>💛 PLEASE — care for your body and emotions</summary><div class="please-inner"><p>PLEASE is an Emotion Regulation skill for reducing vulnerability to intense emotions. Tap each letter to see what it means.</p>${parts.map(([letter,title,description])=>`<details class="please-part"><summary><span class="please-letter">${letter}</span> ${title}</summary><p>${description}</p></details>`).join('')}<p class="muted"><small>The acronym is traditionally written PL–E–A–S–E. Adapt these suggestions to your health and circumstances.</small></p></div></details>`}

function stopMarkup(){return `<div class="card"><button class="stop-sign" aria-label="Tap STOP sign to start guided STOP practice" onclick="stopStep=0;updateStop()"><svg viewBox="0 0 240 190" xmlns="http://www.w3.org/2000/svg"><path d="M78 8 H162 L222 65 V125 L162 182 H78 L18 125 V65 Z" fill="#e62932" stroke="white" stroke-width="8"/><text x="120" y="111" text-anchor="middle" font-size="50" font-weight="900" fill="white">STOP</text></svg></button><p style="text-align:center">Tap the sign to begin.</p><div class="stop-panel" id="stopPanel" aria-live="polite"><b>STOP practice</b><p>When you're ready, tap the sign or Start below.</p><button class="primary" onclick="stopStep=0;updateStop()">Start STOP</button></div></div>`}
function updateStop(){const e=document.getElementById('stopPanel');if(!e)return;const st=stopSteps[stopStep];e.innerHTML=`<p><b>Step ${stopStep+1} of 4</b></p><div class="stop-step"><div class="stop-letter">${st[0]}</div><div><h3>${st[1]}</h3><p>${st[2]}</p></div></div><div class="stepbuttons"><button ${stopStep===0?'disabled':''} onclick="stopStep--;updateStop()">← Back</button><button class="primary" onclick="stopStep=(stopStep+1)%4;updateStop()">${stopStep===3?'Start over':'Next step →'}</button></div>`}
const reflectionCards=[['Self-respect','I can honor my needs while respecting others.','What boundary would make this week easier?'],['Mindfulness','I can notice a feeling without acting on it.','What feeling can I make room for today?'],['Relationships','I can care about someone and still disagree.','Where could I practice both kindness and honesty?'],['Strengths','Small steps are still meaningful steps.','What have I handled better lately?'],['Joy','I can make room for something pleasant today.','What simple activity brings me a little joy?'],['Choice','I do not have to answer every irritation.','When could a pause protect my peace?'],['Acceptance','I can acknowledge reality without approving of it.','What fact am I ready to recognize today?'],['Self-compassion','Learning a skill takes practice, not perfection.','How would I encourage a friend in my situation?']];let currentCard=null,cardFlipped=false;function drawCard(){let next=Math.floor(Math.random()*reflectionCards.length);if(currentCard&&reflectionCards.length>1&&reflectionCards[next]===currentCard)next=(next+1)%reflectionCards.length;currentCard=reflectionCards[next];cardFlipped=false;showCard()}function flipCard(){if(!currentCard){drawCard();return}cardFlipped=!cardFlipped;showCard()}function showCard(){document.getElementById('cardcategory').textContent=currentCard[0];document.getElementById('cardtext').textContent=cardFlipped?currentCard[2]:currentCard[1];document.getElementById('cardhint').textContent=cardFlipped?'Reflection question':'Tap Flip card for your question';saveReflectionDraft()}function downloadReflection(){downloadText('dbt-reflection-'+new Date().toISOString().slice(0,10)+'.txt','Card: '+(currentCard?currentCard[1]:'None drawn')+'\nQuestion: '+(currentCard?currentCard[2]:'')+'\nWhat it means to me: '+v('shareMeaning')+'\nMy focus: '+v('focus'))}function downloadText(filename,text){const blob=new Blob([text],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function v(id){return document.getElementById(id).value}function downloadChain(){saveChainField();downloadText('dbt-chain-analysis-'+new Date().toISOString().slice(0,10)+'.txt',chainExport(chainAnswers));showSaveToast('Download requested. If your browser asks, confirm Download, then check your Downloads folder.')}function downloadDiary(){downloadText('dbt-diary-'+new Date().toISOString().slice(0,10)+'.txt',`Emotions: ${selectedEmotions.map(w=>w+' ('+(emotionIntensities[w]??5)+'/10)').join(', ')||'Not specified'}\nOverall intensity: ${v('mood')}/10\nSkill: ${v('used')}\nReflection: ${v('note')}`)}function downloadJournal(){downloadText('dbt-journal-'+new Date().toISOString().slice(0,10)+'.txt',v('journal'))}

function saveJournalEntry(){const el=document.getElementById('journal');if(!el)return;const value=el.value;if(!value.trim()){showSaveToast('Write something before saving your journal entry.',true);return}const entries=readJournalEntries();const id=activeJournalEntryId||('journal-'+Date.now()+'-'+Math.random().toString(36).slice(2,7));const now=new Date().toISOString();entries[id]={text:value,created:entries[id]?.created||now,updated:now};try{localStorage.setItem(JOURNAL_ENTRIES_KEY,JSON.stringify(entries));if(localStorage.getItem(JOURNAL_ENTRIES_KEY)!==JSON.stringify(entries))throw Error('storage');activeJournalEntryId=id;showSaveToast('Journal entry saved in My Saved Work. Download a complete backup to keep it across app copies.');}catch(e){showSaveToast('Unable to save this entry in browser storage. Download your entry now.',true)}}
function journalSavedCards(){const entries=readJournalEntries();const ids=Object.keys(entries).sort((a,b)=>(entries[b]?.updated||'').localeCompare(entries[a]?.updated||''));return ids.length?ids.map(id=>{const e=entries[id];if(!e||typeof e.text!=='string')return '';return `<div class="card"><h3>${escapeHTML((e.text.trim().split('\n')[0]||'Journal entry').slice(0,65))}</h3><p class="muted">${escapeHTML(new Date(e.updated||e.created).toLocaleString())}</p><p>${escapeHTML(e.text.slice(0,140))}${e.text.length>140?'…':''}</p><button class="primary" onclick="openJournalEntry('${id}')">Open &amp; edit</button> <button onclick="downloadSavedJournalEntry('${id}')">Download</button> <button onclick="deleteJournalEntry('${id}')">Delete</button></div>`}).join(''):'<p>No saved journal entries yet. Go to Journal, write something and tap Save entry.</p>'}
function openJournalEntry(id){const e=readJournalEntries()[id];if(!e||typeof e.text!=='string')return;activeJournalEntryId=id;journalDraftFallback=e.text;go('Journal');const el=document.getElementById('journal');if(el)el.value=e.text;const status=document.getElementById('journal-save-status');if(status)status.textContent='Editing saved entry. Tap Save entry to keep changes.';}
function downloadSavedJournalEntry(id){const e=readJournalEntries()[id];if(e&&typeof e.text==='string')downloadText('dbt-journal-'+(e.created||new Date().toISOString()).slice(0,10)+'.txt',e.text)}
function deleteJournalEntry(id){if(!confirm('Delete this saved journal entry? This cannot be undone unless you have a backup.'))return;const entries=readJournalEntries();delete entries[id];try{localStorage.setItem(JOURNAL_ENTRIES_KEY,JSON.stringify(entries));if(activeJournalEntryId===id)activeJournalEntryId=null;render();showSaveToast('Saved journal entry deleted.')}catch(e){showSaveToast('Unable to delete entry in this browser.',true)}}

function diaryMonday(date){let d=new Date(date.getFullYear(),date.getMonth(),date.getDate());d.setDate(d.getDate()-(d.getDay()+6)%7);return d}
function diaryWeekKey(){return diaryMonday(diaryWeek).toISOString().slice(0,10)}
function diaryEmpty(){return {days:Array.from({length:7},()=>({})),skills:{},notes:'',beforeAfter:{},updated:''}}
function diaryLoad(){diaryData=JSON.parse(JSON.stringify(diaryStore[diaryWeekKey()]||diaryEmpty()));if(!diaryData.beforeAfter)diaryData.beforeAfter={};for(let i=0;i<7;i++){let m=diaryData.days[i]?.meds;if(m==='Yes'||m==='No'){if(!diaryData.skills['Took medication'])diaryData.skills['Took medication']=Array(7).fill(false);diaryData.skills['Took medication'][i]=m==='Yes'}}}

function diaryFieldInput(key,label){let val=diaryData.days[diaryDay][key]??'';const rating=['urgeUse','selfHarmUrge','suicidalUrge','anger','fear','joy','misery','pain','sadness','shame','skillRating'].includes(key);const choice=['alcohol','streetDrugs','meds','selfHarmAction','suicidalAction'].includes(key);let input=rating?`<select onchange="diarySet('${key}',this.value)"><option value="">Not entered</option>${Array.from({length:key==='skillRating'?8:6},(_,i)=>`<option value="${i}" ${String(val)===String(i)?'selected':''}>${i}</option>`).join('')}</select>`:choice?`<select onchange="diarySet('${key}',this.value)"><option value="">Not entered</option><option value="Yes" ${val==='Yes'?'selected':''}>Yes</option><option value="No" ${val==='No'?'selected':''}>No</option></select>`:key==='lies'?`<input type="number" min="0" value="${escapeHTML(val)}" oninput="diarySet('${key}',this.value)">`:`<input value="${escapeHTML(val)}" oninput="diarySet('${key}',this.value)">`;return `<div class="diary-field"><label>${escapeHTML(label)}</label>${input}</div>`}
function diarySet(key,value){diaryData.days[diaryDay][key]=value;if(key==='meds'){if(!diaryData.skills['Took medication'])diaryData.skills['Took medication']=Array(7).fill(false);diaryData.skills['Took medication'][diaryDay]=value==='Yes'}diaryAutoSave()}
function diaryAutoSave(){try{diaryData.updated=new Date().toISOString();diaryStore[diaryWeekKey()]=diaryData;localStorage.setItem('dbt-companion-diary-v14',JSON.stringify(diaryStore))}catch(e){showSaveToast('Unable to save diary in this browser. Download a backup.',true)}}

function diaryRatingGuide(){return `<details class="diary-rating-guide"><summary><strong>What does skills used (0–7) mean?</strong></summary><p>0 = Didn't think of a skill<br>1 = Thought of it, didn't want to use it<br>2 = Wanted to use it, but didn't<br>3 = Tried, but couldn't use it<br>4 = Used it, didn't help<br>5 = Used it, helped<br>6 = Used it automatically, didn't help<br>7 = Used it automatically, helped</p></details>`}
