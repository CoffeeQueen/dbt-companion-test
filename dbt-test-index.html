function diaryEmotionCharacter(i){const eyes=i===0?'<path d="M39 61l24 7M101 61l-24 7" stroke="#56323D" stroke-width="7" stroke-linecap="round"/>':'<circle cx="56" cy="67" r="5" fill="#56323D"/><circle cx="84" cy="67" r="5" fill="#56323D"/>';const mouth=i===2?'<path d="M49 88q21 26 42 0" fill="none" stroke="#56323D" stroke-width="6" stroke-linecap="round"/>':'<path d="M52 98q18 -15 36 0" fill="none" stroke="#56323D" stroke-width="6" stroke-linecap="round"/>';return `<svg viewBox="0 0 140 140" width="130" height="130" role="img" aria-label="Original expressive ${diaryEmotionCards[i][1].toLowerCase()} character"><path d="M30 45 Q22 14 49 25 Q70 4 90 25 Q120 17 112 48 Q127 88 106 112 Q70 134 35 111 Q13 83 30 45" fill="#fff2de" stroke="#56323D" stroke-width="4"/>${eyes}${mouth}<circle cx="38" cy="85" r="9" fill="#F6A89B" opacity=".8"/><circle cx="102" cy="85" r="9" fill="#F6A89B" opacity=".8"/></svg>`}
function diaryEmotionDeck(){const i=diaryEmotionIndex,c=diaryEmotionCards[i],v=diaryData.days[diaryDay][c[0]]??'';return `<div class="diary-deck-wrap"><div class="diary-deck-progress">Emotion ${i+1} of ${diaryEmotionCards.length} · ${diaryDays[diaryDay]}</div><div class="diary-deck-stack"><div class="diary-deck-back one"></div><div class="diary-deck-back two"></div><div class="diary-deck-card" style="--emotion-card-color:${c[2]}">${diaryEmotionFlipped?`<div class="diary-deck-inner diary-deck-rating"><h3>${c[1]}</h3><p>How intense was it today?</p><div class="diary-deck-rating-buttons" role="group" aria-label="Rate ${c[1]} from zero to five">${Array.from({length:6},(_,n)=>`<button type="button" aria-pressed="${String(v)===String(n)}" class="${String(v)===String(n)?'selected':''}" onclick="diaryEmotionRate(${n})">${n}</button>`).join('')}</div><p class="diary-deck-hint">0 = None · 3 = Moderate · 5 = Very intense</p><button type="button" class="diary-deck-flip" onclick="diaryEmotionFlip()">↶ Flip to front</button></div>`:`<div class="diary-deck-inner"><h3>${c[1]}</h3>${diaryEmotionCharacter(i)}<p>${c[4]}</p><button type="button" class="diary-deck-flip" onclick="diaryEmotionFlip()">Flip to rate ↪</button></div>`}</div></div><div class="diary-deck-nav"><button type="button" onclick="diaryEmotionMove(-1)" ${i===0?'disabled':''}>← Previous</button><span>${v===''?'Not rated':`Rated ${v}/5`}</span><button type="button" onclick="diaryEmotionMove(1)" ${i===diaryEmotionCards.length-1?'disabled':''}>Next →</button></div><p class="diary-deck-hint">You can return to any card and change your answer. Unrated cards stay blank.</p></div>`}
function diaryEmotionRefresh(){const el=document.getElementById('diary-emotion-deck');if(el)el.innerHTML=diaryEmotionDeck()}
function diaryEmotionFlip(){diaryEmotionFlipped=!diaryEmotionFlipped;diaryEmotionRefresh()}
function diaryEmotionMove(d){diaryEmotionIndex=Math.max(0,Math.min(diaryEmotionCards.length-1,diaryEmotionIndex+d));diaryEmotionFlipped=false;diaryEmotionRefresh()}
function diaryEmotionRate(n){const key=diaryEmotionCards[diaryEmotionIndex][0];diarySet(key,String(n));diaryEmotionRefresh()}
function diaryDailyMarkup(){let core=['anger','fear','joy','misery','pain','sadness','shame','skillRating'];let optional=['urgeUse','alcohol','streetDrugs','meds','otherBehavior','lies'];let sensitive=['selfHarmUrge','selfHarmAction','suicidalUrge','suicidalAction'];return `<div class="diary-daybar">${diaryDays.map((d,i)=>`<button class="${diaryDay===i?'primary':''}" onclick="diarySelectDay(${i})">${d}</button>`).join('')}</div><div class="card diary-accent-green"><h3>${diaryDays[diaryDay]} — Daily check-in</h3><p>Choose a rating or leave an item blank. Zero is different from not answered.</p><div class="diary-fields">${diaryFeelingGuide()}${diaryWheelGuide()}<p style="grid-column:1/-1;margin:0"><small><strong>Misery</strong> means an overall feeling of intense unhappiness or emotional distress. It can include several feelings at once.</small></p><div id="diary-emotion-deck" style="grid-column:1/-1">${diaryEmotionDeck()}</div>${diaryRatingGuide()}${diaryFieldInput('skillRating',diaryFields.find(f=>f[0]==='skillRating')[1])}</div></div><div class="card diary-accent-pink"><h3>Optional personal tracking</h3><p>Medication, substance use, urges, actions and personal goals. These are private entries, not judgments.</p><button onclick="diaryShowSensitive=!diaryShowSensitive;render()">${diaryShowSensitive?'Hide':'Show'} optional fields</button>${diaryShowSensitive?`<div class="diary-fields">${optional.map(k=>diaryFieldInput(k,diaryFields.find(f=>f[0]===k)[1])).join('')}</div><details class="diary-rating-guide" style="margin-top:14px"><summary><strong>Additional DBT tracking (sensitive topics)</strong></summary><p>Optional tracking of self-harm and suicidal urges or actions, as found on some DBT diary cards. Only open this if it is useful to you. For immediate support in the U.S., call or text 988.</p><div class="diary-fields">${sensitive.map(k=>diaryFieldInput(k,diaryFields.find(f=>f[0]===k)[1])).join('')}</div></details>`:''}</div><div class="card diary-accent-red"><details class="diary-before-after"><summary style="cursor:pointer;font-weight:700;font-size:1.12em;padding:8px 0">Before and after — tap to expand</summary><p>Optional ratings or brief notes about urges, emotions, behaviors and thoughts. These reflections apply to the selected day.</p>${['Urge before','Urge after','Emotions before','Emotions after','Behaviors before','Behaviors after','Thoughts before','Thoughts after'].map(k=>`<label>${k}<input value="${escapeHTML(diaryData.beforeAfter[diaryDay]?.[k]??diaryData.beforeAfter[k]??'')}" oninput="diarySetBefore('${k}',this.value)"></label>`).join('')}</details></div><p><button class="primary" onclick="diarySave()">Save this week</button> <button onclick="diaryDownload()">Download backup</button></p>`}
function diarySkillsMarkup(){return `<p>Mark each day you used a skill. This list is organized into groups for easier phone use.</p>${diarySkills.map(([group,skills])=>`<details class="card diary-skill-group"><summary><strong>${group}</strong></summary>${skills.map(skill=>`<div class="diary-skill-row"><strong>${escapeHTML(skill)}</strong><div class="diary-checks">${diaryDays.map((d,i)=>`<label><span>${d}</span><input type="checkbox" aria-label="${escapeHTML(skill)} ${d}" ${diaryData.skills[skill]?.[i]?'checked':''} onchange="diarySkillToggle('${skill.replace(/'/g,"\\'")}',${i},this.checked)"></label>`).join('')}</div></div>`).join('')}</details>`).join('')}<p><button class="primary" onclick="diarySave()">Save this week</button> <button onclick="diaryDownload()">Download backup</button></p>`}
function diaryReviewMarkup(){return `<p>Review your two-sided weekly diary card. Tap a section to expand it.</p><details class="card privacy-fold"><summary>Front — daily tracking</summary><div class="diary-table-wrap"><table class="diary-table"><thead><tr><th>Front — daily tracking</th>${diaryDays.map(d=>`<th>${d}</th>`).join('')}</tr></thead><tbody>${diaryFields.map(([k,label])=>`<tr><th>${escapeHTML(label)}</th>${diaryDays.map((d,i)=>`<td>${escapeHTML(diaryData.days[i][k]??'—')}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details><details class="card privacy-fold"><summary>Back — skills used</summary><div class="diary-table-wrap"><table class="diary-table"><thead><tr><th>Skill</th>${diaryDays.map(d=>`<th>${d}</th>`).join('')}</tr></thead><tbody>${diarySkills.map(([group,skills])=>skills.map(skill=>`<tr><th>${escapeHTML(skill)}</th>${diaryDays.map((d,i)=>`<td>${diaryData.skills[skill]?.[i]?'✓':'—'}</td>`).join('')}</tr>`).join('')).join('')}</tbody></table></div></details><details class="card privacy-fold"><summary>Before-and-after reflections</summary><p>Daily reflections you've recorded, including changes in urges, feelings, behaviors and thoughts.</p>${diaryDays.map((d,i)=>{let data=diaryData.beforeAfter[i]||{};if(i===0){for(let k of ['Urge before','Urge after','Emotions before','Emotions after','Behaviors before','Behaviors after','Thoughts before','Thoughts after'])if(data[k]===undefined&&diaryData.beforeAfter[k]!==undefined)data[k]=diaryData.beforeAfter[k]}let entries=Object.entries(data).filter(([k,v])=>typeof v==='string'&&v.trim());return entries.length?`<div class="card"><h4>${d}</h4>${entries.map(([k,v])=>`<p><strong>${escapeHTML(k)}:</strong> ${escapeHTML(v)}</p>`).join('')}</div>`:''}).join('')||'<p>No before-and-after reflections entered yet.</p>'}</details><label>Notes about the week<textarea oninput="diarySetNote(this.value)" placeholder="Important events, triggers, things you want to discuss in group…">${escapeHTML(diaryData.notes||'')}</textarea></label><p><button class="primary" onclick="diarySave()">Save this week</button> <button onclick="diaryDownload()">Download full weekly diary</button></p>`}
function diaryMarkup(){if(!diaryData)diaryLoad();return `<h2>Weekly Diary Card</h2><p>Daily check-ins, a seven-day skills checklist and a paper-style weekly review. Entries stay in this browser unless you download them.</p><div class="card diary-week"><button onclick="diaryShiftWeek(-1)" aria-label="Previous week">←</button><strong>${diaryDateLabel()}</strong><button onclick="diaryShiftWeek(1)" aria-label="Next week">→</button></div><div class="diary-tabs"><button class="${diaryPage==='daily'?'primary':''}" onclick="diarySwitch('daily')">Daily tracking</button><button class="${diaryPage==='skills'?'primary':''}" onclick="diarySwitch('skills')">Skills checklist</button><button class="${diaryPage==='review'?'primary':''}" onclick="diarySwitch('review')">Weekly review</button></div>${diaryPage==='daily'?diaryDailyMarkup():diaryPage==='skills'?diarySkillsMarkup():diaryReviewMarkup()}<p class="muted"><small>Browser data isn't encrypted or backed up. Download important records and keep them somewhere private. This is a self-help tool, not crisis monitoring.</small></p>`}
function diarySave(){diaryAutoSave();showSaveToast('✓ Weekly diary saved! Find it under My Saved Work.')}
function diaryExport(){let out=['DBT Companion — Weekly Diary','Week: '+diaryDateLabel(),'','DAILY TRACKING'];for(let i=0;i<7;i++){out.push('\n'+diaryDays[i]);for(let [k,label] of diaryFields)out.push(label+': '+(diaryData.days[i][k]??'Not entered'))}out.push('\nSKILLS CHECKLIST');for(let [group,skills] of diarySkills){out.push('\n'+group);for(let skill of skills)out.push(skill+': '+diaryDays.filter((d,i)=>diaryData.skills[skill]?.[i]).join(', '))}out.push('\nBEFORE AND AFTER');for(let i=0;i<7;i++){let entry=diaryData.beforeAfter[i]||{};if(i===0){for(let [k,v] of Object.entries(diaryData.beforeAfter))if(typeof v==='string'&&entry[k]===undefined)entry[k]=v}out.push('\n'+diaryDays[i]);for(let [k,v] of Object.entries(entry))if(typeof v==='string'&&v.trim())out.push(k+': '+v)}out.push('\nWEEKLY NOTES\n'+(diaryData.notes||''));return out.join('\n')}
function diaryDownload(){diaryAutoSave();downloadText('dbt-weekly-diary-'+diaryWeekKey()+'.txt',diaryExport());showSaveToast('Download requested. Check Downloads and confirm any browser prompt.')}
function diarySavedCards(){let keys=Object.keys(diaryStore).sort().reverse();return `<h2>Saved diary weeks</h2>${keys.length?keys.map(key=>`<div class="card"><h3>Week of ${escapeHTML(key)}</h3><p class="muted">${escapeHTML(diaryStore[key].updated?new Date(diaryStore[key].updated).toLocaleString():'Saved')}</p><button class="primary" onclick="diaryOpen('${key}')">Open & edit</button> <button onclick="diaryDownloadSaved('${key}')">Download</button> <button onclick="diaryDelete('${key}')">Delete</button></div>`).join(''):'<p>No weekly diaries saved yet.</p>'}`}

function diaryDownloadSaved(key){let old=diaryWeek,oldData=diaryData;diaryWeek=new Date(key+'T12:00:00');diaryLoad();diaryDownload();diaryWeek=old;diaryData=oldData}
function diaryDelete(key){if(!confirm('Delete the saved diary for '+key+'? Download it first if needed.'))return;delete diaryStore[key];try{localStorage.setItem('dbt-companion-diary-v14',JSON.stringify(diaryStore));if(diaryWeekKey()===key)diaryLoad();render();showSaveToast('Saved diary deleted.')}catch(e){showSaveToast('Could not delete saved diary.',true)}}


// Reflection Jar: save card, both responses, and optional in-progress draft.
const REFLECTION_ENTRIES_KEY='dbt-companion-reflections-v1';
const REFLECTION_DRAFT_KEY='dbt-companion-reflection-draft-v1';
let reflectionDraftFallback=null,activeReflectionEntryId=null;
function readReflectionEntries(){try{const value=JSON.parse(localStorage.getItem(REFLECTION_ENTRIES_KEY)||'{}');return value&&typeof value==='object'&&!Array.isArray(value)?value:{}}catch(e){return {}}}
function reflectionSnapshot(){return {cardIndex:currentCard?reflectionCards.indexOf(currentCard):-1,flipped:cardFlipped,meaning:document.getElementById('shareMeaning')?.value||'',focus:document.getElementById('focus')?.value||''}}
function saveReflectionDraft(){const data=reflectionSnapshot();reflectionDraftFallback=data;try{localStorage.setItem(REFLECTION_DRAFT_KEY,JSON.stringify(data))}catch(e){}}
function restoreReflectionDraft(){let data=reflectionDraftFallback;try{data=JSON.parse(localStorage.getItem(REFLECTION_DRAFT_KEY)||'null')||data}catch(e){}if(!data)return;const idx=Number(data.cardIndex);if(Number.isInteger(idx)&&idx>=0&&idx<reflectionCards.length){currentCard=reflectionCards[idx];cardFlipped=!!data.flipped;showCard()}const meaning=document.getElementById('shareMeaning'),focus=document.getElementById('focus');if(meaning)meaning.value=String(data.meaning||'');if(focus)focus.value=String(data.focus||'');}
function saveReflectionEntry(){const data=reflectionSnapshot();if(data.cardIndex<0){showSaveToast('Draw a reflection card before saving.',true);return}if(!data.meaning.trim()&&!data.focus.trim()){showSaveToast('Write a response before saving your reflection.',true);return}const entries=readReflectionEntries();const id=activeReflectionEntryId||('reflection-'+Date.now()+'-'+Math.random().toString(36).slice(2,7));const now=new Date().toISOString();entries[id]={...data,created:entries[id]?.created||now,updated:now};try{const value=JSON.stringify(entries);localStorage.setItem(REFLECTION_ENTRIES_KEY,value);if(localStorage.getItem(REFLECTION_ENTRIES_KEY)!==value)throw Error('storage');activeReflectionEntryId=id;showSaveToast('Reflection saved in My Saved Work. Download a complete backup to keep it across app copies.')}catch(e){showSaveToast('Could not save reflection in this browser. Download your reflection instead.',true)}}
function openSavedReflection(id){const entry=readReflectionEntries()[id];if(!entry)return;activeReflectionEntryId=id;reflectionDraftFallback={cardIndex:entry.cardIndex,flipped:!!entry.flipped,meaning:entry.meaning,focus:entry.focus};try{localStorage.setItem(REFLECTION_DRAFT_KEY,JSON.stringify(reflectionDraftFallback))}catch(e){}go('Reflection Jar')}
function reflectionExport(entry){const card=reflectionCards[entry.cardIndex];return 'DBT Companion | Reflection\nDate: '+new Date(entry.updated||entry.created||Date.now()).toLocaleString()+'\nCard: '+(card?card[0]+' — '+card[1]:'Unknown')+'\nQuestion: '+(card?card[2]:'')+'\n\nWhat this means to me:\n'+entry.meaning+'\n\nMy focus this week:\n'+entry.focus}
function downloadSavedReflection(id){const entry=readReflectionEntries()[id];if(entry)downloadText('dbt-reflection-'+new Date().toISOString().slice(0,10)+'.txt',reflectionExport(entry))}
function deleteSavedReflection(id){if(!confirm('Delete this saved reflection? This cannot be undone unless you have a backup.'))return;const entries=readReflectionEntries();delete entries[id];try{localStorage.setItem(REFLECTION_ENTRIES_KEY,JSON.stringify(entries));if(activeReflectionEntryId===id)activeReflectionEntryId=null;render();showSaveToast('Saved reflection deleted.')}catch(e){showSaveToast('Could not delete this reflection.',true)}}
function reflectionSavedCards(){const entries=readReflectionEntries();const ids=Object.keys(entries).sort((a,b)=>String(entries[b].updated||'').localeCompare(String(entries[a].updated||'')));return ids.length?ids.map(id=>{const e=entries[id],card=reflectionCards[e.cardIndex];return `<div class="card"><h3>${escapeHTML(card?.[0]||'Reflection')}</h3><p class="muted">${escapeHTML(new Date(e.updated||e.created).toLocaleString())}</p><p>${escapeHTML((e.meaning||e.focus||'').slice(0,160))}</p><button class="primary" onclick="openSavedReflection('${id}')">Open & edit</button> <button onclick="downloadSavedReflection('${id}')">Download</button> <button onclick="deleteSavedReflection('${id}')">Delete</button></div>`}).join(''):'<p>No saved reflections yet. Draw a card in Reflection Jar, write a response, and tap Save reflection.</p>'}
function clearReflectionDraft(){if(!confirm('Clear the current reflection draft? Saved reflections will remain in My Saved Work.'))return;activeReflectionEntryId=null;reflectionDraftFallback=null;currentCard=null;cardFlipped=false;try{localStorage.removeItem(REFLECTION_DRAFT_KEY)}catch(e){}render();showSaveToast('Reflection draft cleared. Saved reflections were not deleted.')}

// Version 1.8: portable backup and restore. Explicit user action only.
const BACKUP_KEYS=['dbt-companion-reflections-v1','dbt-companion-journal-entries-v1','dbt-companion-theme','dbt-companion-chains-v11','dbt-companion-practice-v09','dbt-companion-practice-dates','dbt-companion-diary-v14'];
const backupPanel=()=>`<div class="card guide-teal" id="backup-panel"><h3>Backup & Restore — v1.8</h3><p>Keep your saved reflections, journal entries, diary weeks, chain analyses, skills practice drafts and theme preference together in one JSON backup file. This includes sensitive personal information. Store it privately.</p><p><button class="primary" type="button" onclick="exportAllBackup()">Download complete backup</button></p><label for="backup-upload">Restore from a DBT Companion backup (.json)</label><input id="backup-upload" type="file" accept=".json,application/json" onchange="prepareBackupRestore(this)"/><div id="backup-restore-preview" role="status" aria-live="polite"></div><p class="muted"><small>Restore replaces the saved diary, chain, and practice collections in this browser after your confirmation. Download a backup of current work first. A backup is not encrypted, and downloads may remain on your device or in cloud-synced folders. Unsaved Journal and Reflection Jar drafts are not included; save them as entries first.</small></p></div>`;
// Backup panel is rendered once inside the expandable Saved Work section.
const originalPrivacyGuideMarkup=privacyGuideMarkup;
privacyGuideMarkup=function(){return originalPrivacyGuideMarkup()+`<div class="card guide-teal"><h3>Moving to a new version or phone</h3><p>Open <b>My Saved Work</b> and tap <b>Download complete backup</b>. Keep the downloaded JSON file private. In the new app, open <b>My Saved Work</b>, choose that file under Restore, review the preview and confirm. Your old browser data will not transfer by itself.</p><p>Backup files contain readable mental-health entries; they are not encrypted. Do not email or share them casually. Test the restored entries before deleting the old copy.</p></div>`};
function exportAllBackup(){
 try{
  const records={};
  for(const key of BACKUP_KEYS){const value=localStorage.getItem(key);if(value!==null)records[key]=value;}
  const payload={app:'DBT Companion',format:'dbt-companion-backup',version:1,created:new Date().toISOString(),records};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='dbt-companion-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000);
  showSaveToast('Backup download requested. Check Downloads and keep the JSON file private.');
 }catch(e){showSaveToast('Backup could not be created. Your saved work has not changed.',true)}
}
let pendingBackup=null;
async function prepareBackupRestore(input){
 const preview=document.getElementById('backup-restore-preview');pendingBackup=null;preview.textContent='';
 const file=input.files&&input.files[0];if(!file)return;
 if(file.size>5*1024*1024){preview.textContent='File too large (5 MB maximum). No changes made.';return;}
 try{
  const parsed=JSON.parse(await file.text());
  if(parsed.app!=='DBT Companion'||parsed.format!=='dbt-companion-backup'||parsed.version!==1||!parsed.records||typeof parsed.records!=='object'||Array.isArray(parsed.records))throw Error('Not a supported DBT Companion backup.');
  const records=parsed.records;
  if(Object.keys(records).some(k=>!BACKUP_KEYS.includes(k)))throw Error('Unexpected backup fields.');
  for(const [k,v] of Object.entries(records)){
   if(typeof v!=='string')throw Error('Invalid saved data.');
   if(k==='dbt-companion-theme'){if(!['light','dark'].includes(v))throw Error('Invalid theme.');}
   else {const obj=JSON.parse(v);if(!obj||typeof obj!=='object'||Array.isArray(obj))throw Error('Invalid saved collection.');if(k==='dbt-companion-journal-entries-v1'&&Object.values(obj).some(e=>!e||typeof e!=='object'||typeof e.text!=='string'||e.text.length>250000))throw Error('Invalid journal entries.');if(k==='dbt-companion-reflections-v1'&&Object.values(obj).some(e=>!e||typeof e!=='object'||typeof e.meaning!=='string'||typeof e.focus!=='string'||e.meaning.length>250000||e.focus.length>250000||!Number.isInteger(e.cardIndex)||e.cardIndex<0||e.cardIndex>=reflectionCards.length))throw Error('Invalid saved reflections.');}
  }
  pendingBackup=records;
  const count=k=>{try{return Object.keys(JSON.parse(records[k]||'{}')).length}catch(e){return 0}};
  preview.innerHTML=`<p><b>Backup ready to review:</b> ${count('dbt-companion-diary-v14')} diary week(s), ${count('dbt-companion-chains-v11')} chain analysis draft(s), ${count('dbt-companion-practice-v09')} practice draft(s), ${count('dbt-companion-journal-entries-v1')} saved journal entry/entries, ${count('dbt-companion-reflections-v1')} saved reflection(s).</p><p><b>Warning:</b> restoring replaces the current saved collections, including collections absent from this backup. Back up current work first.</p><button type="button" class="primary" onclick="confirmBackupRestore()">Confirm restore</button> <button type="button" onclick="cancelBackupRestore()">Cancel</button>`;
 }catch(e){preview.textContent='Could not read this backup: '+e.message+' No changes made.';input.value='';}
}
function cancelBackupRestore(){pendingBackup=null;const p=document.getElementById('backup-restore-preview');if(p)p.textContent='Restore canceled. Nothing changed.';const i=document.getElementById('backup-upload');if(i)i.value=''}
function confirmBackupRestore(){
 if(!pendingBackup)return;
 if(!confirm('Replace this browser’s saved diary weeks, chain analyses, practice drafts, journal entries and reflections with the selected backup? Download a backup of current work first.'))return;
 const before={};
 try{
  for(const key of BACKUP_KEYS)before[key]=localStorage.getItem(key);
  for(const key of BACKUP_KEYS){if(Object.prototype.hasOwnProperty.call(pendingBackup,key))localStorage.setItem(key,pendingBackup[key]);else if(key!=='dbt-companion-journal-entries-v1'&&key!=='dbt-companion-reflections-v1')localStorage.removeItem(key);}
  for(const key of BACKUP_KEYS){const expected=Object.prototype.hasOwnProperty.call(pendingBackup,key)?pendingBackup[key]:(['dbt-companion-journal-entries-v1','dbt-companion-reflections-v1'].includes(key)?before[key]:null);if(localStorage.getItem(key)!==expected)throw Error('Storage verification failed');}
  chainDrafts=JSON.parse(localStorage.getItem('dbt-companion-chains-v11')||'{}');practiceDrafts=JSON.parse(localStorage.getItem('dbt-companion-practice-v09')||'{}');diaryStore=JSON.parse(localStorage.getItem('dbt-companion-diary-v14')||'{}');activeChainId=null;diaryLoad();setTheme(localStorage.getItem('dbt-companion-theme')||'light');pendingBackup=null;activeReflectionEntryId=null;activeJournalEntryId=null;journalDraftFallback='';try{localStorage.removeItem(JOURNAL_DRAFT_KEY)}catch(e){}render();showSaveToast('✓ Backup restored. Check My Saved Work and Diary Card.');
 }catch(e){
  try{for(const key of BACKUP_KEYS){if(before[key]===null)localStorage.removeItem(key);else if(before[key]!==undefined)localStorage.setItem(key,before[key]);}}catch(rollbackError){}
  showSaveToast('Restore failed. Previous browser data was restored where possible; please verify your entries.',true);
 }
}


// Progressive web app installation requires HTTPS (or localhost). Local file copies remain usable without installation.
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('./service-worker.js').catch(() => {}); });
}

// Collapsible Saved Work categories: closed on every visit; saved data operations unchanged.
function savedWorkMarkup(){
 let meta={};try{meta=JSON.parse(localStorage.getItem('dbt-companion-practice-dates')||'{}')||{}}catch(e){}
 const names=Object.keys(practiceDrafts).filter(n=>typeof practiceDrafts[n]==='string'&&practiceDrafts[n].trim()).sort((a,b)=>(meta[b]||'').localeCompare(meta[a]||''));
 const chains=chainSavedCards();
 const diaries=diarySavedCards().replace(/^<h2>Saved diary weeks<\/h2>/,'');
 const practice=names.length?names.map(n=>`<div class="card"><h3>${escapeHTML(n)} practice</h3><p class="muted">${meta[n]?escapeHTML(new Date(meta[n]).toLocaleString()):'Saved previously'}</p><p>${escapeHTML(practiceDrafts[n].slice(0,160))}${practiceDrafts[n].length>160?'…':''}</p><button class="primary" onclick="openSavedPractice('${n}')">Open & edit</button> <button onclick="downloadSavedPractice('${n}')">Download</button> <button onclick="deleteSavedPractice('${n}')">Delete</button></div>`).join(''):'<div class="card"><h3>No saved drafts yet</h3><p>Go to Skills, open DEAR MAN, GIVE, FAST, or TIPP, write a response, and tap Save draft in browser. It will appear here if browser storage is available.</p><button class="primary" onclick="go(&quot;Skills&quot;)">Go to Skills</button></div>';
 const fold=(title,body)=>`<details class="card privacy-fold"><summary>${title}</summary><div class="saved-fold-content">${body}</div></details>`;
 return `<h2>My Saved Work</h2><div class="card"><p>Saved entries are stored in this browser, not in your Downloads folder. Open an entry to edit it, or download a separate copy.</p><p><strong>Privacy:</strong> Browser entries are not encrypted or automatically backed up. Changing browsers or app copies may make them unavailable. Keep important downloads private.</p></div>`+
 fold('🫙 Saved Reflections ('+Object.keys(readReflectionEntries()).length+')',reflectionSavedCards())+
 fold('📓 Saved Journal Entries ('+Object.keys(readJournalEntries()).length+')',journalSavedCards())+
 fold('📅 Saved Diary Cards ('+Object.keys(diaryStore).length+')',diaries)+
 fold('🔗 Saved Chain Analyses ('+Object.keys(chainDrafts).length+')',chains||'<p>No chain analyses saved yet.</p>')+
 fold('✏️ Saved Skills Practice Drafts ('+names.length+')',practice)+
 fold('💾 Backup & Restore',backupPanel());
}
render();</script></body></html>
